<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VINN | Petrol Station Management</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
    }

    .splash {
      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 50%,
          #ffffff 0%,
          #ffffff 45%,
          #fff4f4 100%
        );
    }

    /* Logo + VINN container */
    .brand-container {
      display: flex;
      align-items: center;
      gap: 30px;

      opacity: 0;
      transform: translateY(30px) scale(0.92);

      animation:
        enter 1.5s ease-out forwards;
    }

    /* Fuel pump image */
    .logo {
      width: 190px;
      height: 190px;

      object-fit: contain;

      animation:
        logoFloat 3s ease-in-out infinite;
    }

    /* VINN text */
    .brand-name {
      display: flex;
      flex-direction: column;

      border-left: 3px solid #e31e24;

      padding-left: 30px;

      transform: translateX(25px);
      opacity: 0;

      animation:
        nameIn 1.2s ease-out 1s forwards;
    }

    .brand-name h1 {
      font-size: clamp(48px, 9vw, 82px);

      line-height: 0.9;

      letter-spacing: 8px;

      font-weight: 900;

      color: #171717;
    }

    .brand-name span {
      margin-top: 14px;

      color: #e31e24;

      font-size: 13px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    /* Loading section */
    .loading {
      position: absolute;

      bottom: 55px;

      left: 50%;

      transform: translateX(-50%);

      width: 180px;

      text-align: center;
    }

    .loading-text {
      color: #888;

      font-size: 11px;

      letter-spacing: 2px;

      margin-bottom: 10px;

      text-transform: uppercase;
    }

    /* Progress bar */
    .progress {
      width: 180px;

      height: 3px;

      background: #eeeeee;

      border-radius: 10px;

      overflow: hidden;
    }

    .progress-bar {
      width: 0%;

      height: 100%;

      background: #e31e24;

      animation:
        progress 10s linear forwards;
    }

    /* Loading dots */
    .dots {
      margin-top: 12px;

      display: flex;

      justify-content: center;

      gap: 5px;
    }

    .dots i {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #d0d0d0;

      animation:
        dot 1.2s infinite;
    }

    .dots i:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dots i:nth-child(3) {
      animation-delay: 0.4s;
    }

    /* Splash exit animation */
    .fade-out {
      animation:
        exit 0.8s ease-in forwards;
    }

    /* Logo entrance */
    @keyframes enter {
      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    /* VINN text entrance */
    @keyframes nameIn {
      to {
        opacity: 1;

        transform:
          translateX(0);
      }
    }

    /* Floating logo */
    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* 10-second progress */
    @keyframes progress {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }

    /* Loading dots */
    @keyframes dot {
      0%,
      60%,
      100% {
        opacity: 0.3;

        transform:
          scale(1);
      }

      30% {
        opacity: 1;

        transform:
          scale(1.35);
      }
    }

    /* Exit animation */
    @keyframes exit {
      to {
        opacity: 0;

        transform:
          scale(1.04);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {

      .brand-container {
        gap: 18px;
      }

      .logo {
        width: 130px;
        height: 130px;
      }

      .brand-name {
        padding-left: 18px;

        border-left-width: 2px;
      }

      .brand-name h1 {
        font-size: 48px;

        letter-spacing: 5px;
      }

      .brand-name span {
        font-size: 9px;

        letter-spacing: 1px;
      }
    }
  </style>
</head>


<body>

  <!-- SPLASH SCREEN -->

  <main class="splash" id="splash">

    <!-- Logo + Brand -->

    <div class="brand-container">

      <!-- Your fuel pump image -->

      <img
        class="logo"
        src="c50c620324b6e91563816604f0eb9dd0.jpg"
        alt="VINN Fuel Station Logo"
      >

      <!-- Brand name beside image -->

      <div class="brand-name">

        <h1>VINN</h1>

        <span>
          Petrol Station Management
        </span>

      </div>

    </div>


    <!-- Loading -->

    <div class="loading">

      <div class="loading-text">
        Loading VINN
      </div>

      <div class="progress">

        <div class="progress-bar"></div>

      </div>


      <div class="dots">

        <i></i>
        <i></i>
        <i></i>

      </div>

    </div>

  </main>


  <script>

    /*
      Splash screen lasts 10 seconds.
    */

    setTimeout(() => {

      document
        .getElementById("splash")
        .classList
        .add("fade-out");


      /*
        When we create login.html,
        change this to:

        window.location.href = "login.html";

      */

    }, 10000);

  </script>

</body>
</html>
