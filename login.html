<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VINN | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, #fff0f0, transparent 35%),
        linear-gradient(135deg, #ffffff, #fff7f7);

      display: flex;
      justify-content: center;
      align-items: center;

      color: #171717;
    }

    .page {
      width: 100%;
      max-width: 450px;
      padding: 22px;
    }

    /*

    =========================
       BRAND
    ========================= */

    .brand-section {
      text-align: center;
      margin-bottom: 25px;

      opacity: 0;
      transform: translateY(-20px);

      animation: brandIn 0.8s ease forwards;
    }

    .logo {
      width: 95px;
      height: 95px;
      object-fit: contain;
      margin-bottom: 8px;

      animation: floating 3s ease-in-out infinite;
    }

    .brand-name {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .brand-description {
      margin-top: 7px;

      color: #888;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* =========================
       LOGIN CARD
    ========================= */

    .login-card {
      background: #ffffff;

      border-radius: 24px;

      padding: 30px 25px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.10);

      opacity: 0;
      transform: translateY(25px);

      animation: cardIn 0.8s ease 0.25s forwards;
    }

    .login-title {
      font-size: 25px;
      font-weight: 800;

      margin-bottom: 7px;
    }

    .login-description {
      color: #777;

      font-size: 13px;

      margin-bottom: 28px;
    }

    /* =========================
       INPUTS
    ========================= */

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;

      border: 1px solid #e2e2e2;

      border-radius: 13px;

      padding: 0 15px;

      font-size: 15px;

      outline: none;

      background: #ffffff;

      transition: 0.2s;
    }

    input:focus {
      border-color: #e31e24;

      box-shadow:
        0 0 0 3px rgba(227, 30, 36, 0.10);
    }

    input.error {
      border-color: #e31e24;
    }

    /*
    =========================
       PASSWORD
    ========================= */

    .password-input {
      padding-right: 65px;
    }

    .show-password {
      position: absolute;

      right: 15px;
      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #e31e24;

      font-size: 11px;
      font-weight: 800;

      cursor: pointer;
    }

    /* =========================
       FORGOT PASSWORD
    ========================= */

    .forgot-row {
      display: flex;

      justify-content: flex-end;

      margin-top: -4px;

      margin-bottom: 23px;
    }

    .forgot {
      color: #e31e24;

      text-decoration: none;

      font-size: 12px;

      font-weight: 700;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    /* =========================
       LOGIN BUTTON
    ========================= */

    .login-button {
      width: 100%;
      height: 53px;

      border: none;

      border-radius: 13px;

      background: #e31e24;

      color: #ffffff;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;

      position: relative;

      overflow: hidden;
    }

    .login-button:hover {
      background: #c9151b;

      transform: translateY(-1px);
    }

    .login-button:active {
      transform: scale(0.98);
    }

    .login-button.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    /* =========================
       ERROR MESSAGE
    ========================= */

    .error-message {
      display: none;

      color: #e31e24;

      font-size: 12px;

      margin-top: 12px;

      text-align: center;
    }

    .error-message.show {
      display: block;
    }

    /*
    =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;

      color: #999;

      font-size: 11px;

      margin-top: 22px;
    }

    /* =========================
       LOADING SPINNER
    ========================= */

    .spinner {
      width: 18px;
      height: 18px;

      border: 2px solid rgba(255, 255, 255, 0.4);

      border-top-color: #ffffff;

      border-radius: 50%;

      display: none;

      margin: auto;

      animation: spin 0.7s linear infinite;
    }

    .login-button.loading .button-text {
      display: none;
    }

    .login-button.loading .spinner {
      display: block;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes brandIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floating {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      .page {
        padding: 18px;
      }

      .logo {
        width: 82px;
        height: 82px;
      }

      .brand-name {
        font-size: 28px;
      }

      .login-card {
        padding: 27px 20px;
        border-radius: 21px;
      }

      .login-title {
        font-size: 23px;
      }
    }
  </style>
</head>


<body>

  <div class="page">

    <!-- =========================
         VINN BRAND
    ========================== -->

    <div class="brand-section">

      <img
        class="logo"
        src="c50c620324b6e91563816604f0eb9dd0.jpg"
        alt="VINN Fuel Station Logo"
      >

      <div class="brand-name">
        VINN
      </div>

      <div class="brand-description">
        Petrol Station Management
      </div>

    </div>


    <!-- =========================
         LOGIN CARD
    ========================== -->

    <div class="login-card">

      <h1 class="login-title">
        Welcome Back
      </h1>

      <p class="login-description">
        Sign in to access your station management system.
      </p>


      <form id="loginForm">


        <!-- EMAIL -->

        <div class="input-group">

          <label for="email">
            Email Address
          </label>

          <div class="input-wrapper">

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >

          </div>

        </div>
 <!-- PASSWORD -->

        <div class="input-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrapper">

            <input
              type="password"
              id="password"
              class="password-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
            >
              SHOW
            </button>

          </div>

        </div>


        <!-- FORGOT PASSWORD -->

        <div class="forgot-row">

          <a
            href="#"
            class="forgot"
            onclick="forgotPassword(event)"
          >
            Forgot password?
          </a>

        </div>


        <!-- LOGIN BUTTON -->

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >

          <span class="button-text">
            Sign In
          </span>

          <span class="spinner"></span>

        </button>


        <!-- ERROR -->

        <div
          class="error-message"
          id="errorMessage"
        ></div>

      </form>

    </div>


    <!-- FOOTER -->

    <div class="footer">
      © 2026 VINN. All rights reserved.
    </div>

  </div>


  <script>

    /* =========================
       SHOW / HIDE PASSWORD
    ========================== */

    const password =
      document.getElementById("password");

    const showPassword =
      document.getElementById("showPassword");


    showPassword.addEventListener("click", function () {

      if (password.type === "password") {

        password.type = "text";

        showPassword.textContent = "HIDE";

      } else {

        password.type = "password";

        showPassword.textContent = "SHOW";

      }

    });


    /* =========================
       LOGIN
    ========================== */

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const errorMessage =
      document.getElementById("errorMessage");


    loginForm.addEventListener("submit", function (event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const passwordValue =
        password.value.trim();


      errorMessage.classList.remove("show");

      errorMessage.textContent = "";


      /* Basic validation */

      if (email === "" || passwordValue === "") {

        errorMessage.textContent =
          "Please enter your email and password.";

        errorMessage.classList.add("show");

        return;
      }


      /* Start loading */

      loginButton.classList.add("loading");


      /*
        DEMO LOGIN

        This is only the front-end for now.

        Later we will connect VINN to a real
        authentication/backend system.
      */

      setTimeout(function () {

        loginButton.classList.remove("loading");

        /*
          When the dashboard is created,
          this will open dashboard.html.
        */

        window.location.href = "dashboard.html";

      }, 1200);

    });


    /* =========================
       FORGOT PASSWORD
    ========================== */

    function forgotPassword(event) {

      event.preventDefault();

      alert(
        "Password recovery will be connected later."
      );

    }

  </script>

</body>
          </html>
