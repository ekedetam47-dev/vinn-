<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VINN Login</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #fff7f7 100%
        );

      display: flex;

      justify-content: center;

      align-items: center;

      color: #171717;

    }


    .container {

      width: 100%;

      max-width: 430px;

      padding: 25px;

    }


    /* =========================
       LOGO
    ========================= */

    .logo-area {

      text-align: center;

      margin-bottom: 28px;

    }


    .logo {

      width: 110px;

      height: 110px;

      object-fit: contain;

      display: block;

      margin: 0 auto 12px auto;

      animation: floatLogo 3s ease-in-out infinite;

    }


    .brand {

      font-size: 34px;

      font-weight: 900;

      letter-spacing: 6px;

    }


    .subtitle {

      margin-top: 7px;

      color: #888;

      font-size: 11px;

      font-weight: 600;

      letter-spacing: 1.5px;

      text-transform: uppercase;

    }


    /* =========================
       LOGIN BOX
    ========================= */

    .login-box {

      background: #ffffff;

      border-radius: 22px;

      padding: 30px 24px;

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.10);

      animation: slideUp 0.7s ease;

    }


    .login-box h2 {

      font-size: 25px;

      margin-bottom: 8px;

    }


    .welcome-text {

      color: #777;

      font-size: 13px;

      margin-bottom: 25px;

    }


    /* =========================
       INPUTS
    ========================= */

    .field {

      margin-bottom: 18px;

    }


    .field label {

      display: block;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 8px;

    }


    .field input {

      width: 100%;

      height: 52px;

      border: 1px solid #dedede;

      border-radius: 12px;

      padding: 0 15px;

      font-size: 15px;

      outline: none;

      transition: 0.2s;

    }


    .field input:focus {

      border-color: #e31e24;

      box-shadow:
        0 0 0 3px
        rgba(227, 30, 36, 0.10);

    }


    /* =========================
       PASSWORD
    ========================= */

    .password-container {

      position: relative;

    }


    .password-container input {

      padding-right: 65px;

    }


    .show-button {

      position: absolute;

      right: 13px;

      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #e31e24;

      font-size: 11px;

      font-weight: 800;

      cursor: pointer;

    }


    /* =========================
       FORGOT PASSWORD
    ========================= */

    .forgot {

      display: block;

      text-align: right;

      color: #e31e24;

      font-size: 12px;

      font-weight: 700;

      text-decoration: none;

      margin-top: -5px;

      margin-bottom: 22px;

    }


    .forgot:hover {

      text-decoration: underline;

    }


     .create-account {
  text-align: center;
  margin-top: 22px;
  font-size: 13px;
  color: #777;
}

.create-account a {
  color: #e31e24;
  font-weight: 700;
  text-decoration: none;
  margin-left: 5px;
}

.create-account a:hover {
  text-decoration: underline;
}
    /* =========================
       LOGIN BUTTON
    ========================= */

    .login-button {

      width: 100%;

      height: 53px;

      border: none;

      border-radius: 12px;

      background: #e31e24;

      color: #ffffff;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;

    }


    .login-button:hover {

      background: #c9151b;

    }


    .login-button:active {

      transform: scale(0.98);

    }


    /* =========================
       MESSAGE
    ========================= */

    .message {

      display: none;

      text-align: center;

      margin-top: 15px;

      font-size: 12px;

      color: #e31e24;

    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      text-align: center;

      color: #999;

      font-size: 11px;

      margin-top: 22px;

    }


    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes floatLogo {

      0% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-7px);

      }

      100% {

        transform:
          translateY(0);

      }

    }


    @keyframes slideUp {

      from {

        opacity: 0;

        transform:
          translateY(25px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      .container {

        padding: 18px;

      }


      .logo {

        width: 90px;

        height: 90px;

      }


      .brand {

        font-size: 29px;

      }


      .login-box {

        padding: 27px 20px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- VINN BRAND -->

    <div class="logo-area">

      <img
        class="logo"
        src="c50c620324b6e91563816604f0eb9dd0.jpg"
        alt="VINN Fuel Station Logo"
      >

      <div class="brand">
        VINN
      </div>

      <div class="subtitle">
        Petrol Station Management
      </div>

    </div>


    <!-- LOGIN BOX -->

    <div class="login-box">

      <h2>
        Welcome Back
      </h2>

      <p class="welcome-text">
        Sign in to continue to your VINN dashboard.
      </p>


      <form
        id="loginForm"
        onsubmit="login(event)"
      >


        <!-- EMAIL -->

        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-container">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              class="show-button"
              onclick="showPassword()"
              id="showButton"
            >
              SHOW
            </button>

          </div>

        </div>


        <!-- FORGOT PASSWORD -->

        <a
          href="#"
          class="forgot"
          onclick="forgotPassword(event)"
        >
          Forgot password?


          <a href="forgot-password.html" class="forgot">
  Forgot password?
          </a>
        
      </a>


        <!-- SIGN IN -->

        <button
          type="submit"
          class="login-button"
        >
          Sign In
        </button>


        <div
          class="message"
          id="message"
        ></div>


        <div class="create-account">
  <span>Don't have an account?</span>

  <a href="create-account.html">
    Create Account
  </a>
        </div>


      </form>

    </div>


    <!-- FOOTER -->

    <div class="footer">

      © 2026 VINN. All rights reserved.

    </div>


  </div>


  <script>


    /* =========================
       SHOW / HIDE PASSWORD
    ========================= */

    function showPassword() {

      const password =
        document.getElementById("password");

      const button =
        document.getElementById("showButton");


      if (
        password.type === "password"
      ) {

        password.type = "text";

        button.textContent = "HIDE";

      }

      else {

        password.type = "password";

        button.textContent = "SHOW";

      }

    }


    /* =========================
       LOGIN
    ========================= */

    function login(event) {

      event.preventDefault();


      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value.trim();

      const message =
        document.getElementById("message");


      if (
        email === "" ||
        password === ""
      ) {

        message.textContent =
          "Please enter your email and password.";

        message.style.display = "block";

        return;

      }


      /*
        DEMO LOGIN

        We will connect this to the
        real VINN authentication system later.
      */

      message.style.color = "#16803c";

      message.textContent =
        "Login successful.";

      message.style.display = "block";


      /*
        Dashboard will be connected
        after we create dashboard.html.

        DO NOT redirect yet.
      */

    }


    /* =========================
       FORGOT PASSWORD
    ========================= */

    function forgotPassword(event) {

      event.preventDefault();


      alert(
        "Password recovery will be added later."
      );

    }


  </script>


</body>

  </html>
