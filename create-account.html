<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VINN | Create Account</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #fff5f5 100%
        );

      color: #171717;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 25px 0;

    }


    .container {

      width: 100%;

      max-width: 450px;

      padding: 20px;

    }


    /* =========================
       BRAND
    ========================= */

    .brand {

      text-align: center;

      margin-bottom: 25px;

    }


    .logo {

      width: 80px;

      height: 80px;

      object-fit: contain;

      margin-bottom: 8px;

    }


    .brand-name {

      font-size: 30px;

      font-weight: 900;

      letter-spacing: 5px;

    }


    .brand-text {

      color: #888;

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 1.5px;

      margin-top: 6px;

      text-transform: uppercase;

    }


    /* =========================
       CARD
    ========================= */

    .card {

      background: #ffffff;

      border-radius: 22px;

      padding: 28px 23px;

      box-shadow:
        0 15px 45px
        rgba(0, 0, 0, 0.10);

    }


    .card h1 {

      font-size: 24px;

      margin-bottom: 7px;

    }


    .description {

      color: #777;

      font-size: 13px;

      line-height: 1.5;

      margin-bottom: 25px;

    }


    /* =========================
       FORM
    ========================= */

    .field {

      margin-bottom: 17px;

    }


    .field label {

      display: block;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 7px;

    }


    .field input {

      width: 100%;

      height: 50px;

      border: 1px solid #dedede;

      border-radius: 12px;

      padding: 0 14px;

      font-size: 14px;

      outline: none;

      transition: 0.2s;

    }


    .field input:focus {

      border-color: #e31e24;

      box-shadow:
        0 0 0 3px
        rgba(227, 30, 36, 0.10);

    }


    /* =========================
       PASSWORD
    ========================= */

    .password-box {

      position: relative;

    }


    .password-box input {

      padding-right: 65px;

    }


    .show-password {

      position: absolute;

      right: 13px;

      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #e31e24;

      font-size: 10px;

      font-weight: 800;

      cursor: pointer;

    }


    /* =========================
       TERMS
    ========================= */

    .terms {

      display: flex;

      align-items: flex-start;

      gap: 8px;

      margin: 5px 0 20px;

      font-size: 11px;

      color: #777;

      line-height: 1.5;

    }


    .terms input {

      margin-top: 2px;

      accent-color: #e31e24;

    }


    .terms a {

      color: #e31e24;

      text-decoration: none;

      font-weight: 700;

    }


    /* =========================
       BUTTON
    ========================= */

    .create-button {

      width: 100%;

      height: 52px;

      border: none;

      border-radius: 12px;

      background: #e31e24;

      color: #ffffff;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;

    }


    .create-button:hover {

      background: #c9151b;

    }


    .create-button:active {

      transform: scale(0.98);

    }


    /* =========================
       MESSAGE
    ========================= */

    .message {

      display: none;

      text-align: center;

      margin-top: 14px;

      font-size: 12px;

    }


    /* =========================
       LOGIN LINK
    ========================= */

    .login-link {

      text-align: center;

      margin-top: 20px;

      font-size: 12px;

      color: #777;

    }


    .login-link a {

      color: #e31e24;

      font-weight: 700;

      text-decoration: none;

      margin-left: 4px;

    }


    .login-link a:hover {

      text-decoration: underline;

    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      text-align: center;

      color: #999;

      font-size: 10px;

      margin-top: 20px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      .container {

        padding: 15px;

      }


      .card {

        padding: 25px 19px;

      }


      .logo {

        width: 70px;

        height: 70px;

      }


      .brand-name {

        font-size: 27px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- =========================
         VINN BRAND
    ========================== -->

    <div class="brand">

      <img
        class="logo"
        src="c50c620324b6e91563816604f0eb9dd0.jpg"
        alt="VINN Fuel Station Logo"
      >

      <div class="brand-name">
        VINN
      </div>

      <div class="brand-text">
        Petrol Station Management
      </div>

    </div>


    <!-- =========================
         CREATE ACCOUNT
    ========================== -->

    <div class="card">

      <h1>
        Create Account
      </h1>

      <p class="description">
        Set up your VINN station account to start
        managing your petrol station.
      </p>


      <form
        id="createAccountForm"
        onsubmit="createAccount(event)"
      >


        <!-- STATION NAME -->

        <div class="field">

          <label for="stationName">
            Station Name
          </label>

          <input
            type="text"
            id="stationName"
            placeholder="Enter station name"
            required
          >

        </div>


        <!-- OWNER NAME -->

        <div class="field">

          <label for="ownerName">
            Owner Name
          </label>

          <input
            type="text"
            id="ownerName"
            placeholder="Enter owner's full name"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter email address"
            required
          >

        </div>


        <!-- PHONE -->

        <div class="field">

          <label for="phone">
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-box">

            <input
              type="password"
              id="password"
              placeholder="Create a password"
              required
              minlength="6"
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword('password', this)"
            >
              SHOW
            </button>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="password-box">

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm your password"
              required
              minlength="6"
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword('confirmPassword', this)"
            >
              SHOW
            </button>

          </div>

        </div>


        <!-- TERMS -->

        <div class="terms">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <label for="terms">
            I agree to the VINN
            <a href="#">
              Terms of Service
            </a>
            and
            <a href="#">
              Privacy Policy
            </a>.
          </label>

        </div>


        <!-- CREATE ACCOUNT -->

        <button
          type="submit"
          class="create-button"
        >
          Create Account
        </button>


        <div
          class="message"
          id="message"
        ></div>


      </form>


      <!-- LOGIN -->

      <div class="login-link">

        Already have an account?

        <a href="login.html">
          Sign In
        </a>

      </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

      © 2026 VINN. All rights reserved.

    </div>


  </div>


  <script>

    /* =========================
       SHOW / HIDE PASSWORD
    ========================= */

    function togglePassword(
      fieldId,
      button
    ) {

      const field =
        document.getElementById(fieldId);


      if (
        field.type === "password"
      ) {

        field.type = "text";

        button.textContent = "HIDE";

      }

      else {

        field.type = "password";

        button.textContent = "SHOW";

      }

    }


    /* =========================
       CREATE ACCOUNT
    ========================= */

    function createAccount(event) {

      event.preventDefault();


      const password =
        document.getElementById(
          "password"
        ).value;


      const confirmPassword =
        document.getElementById(
          "confirmPassword"
        ).value;


      const message =
        document.getElementById(
          "message"
        );


      /* Check passwords */

      if (
        password !== confirmPassword
      ) {

        message.style.display = "block";

        message.style.color =
          "#e31e24";

        message.textContent =
          "Passwords do not match.";

        return;

      }


      /* Password length */

      if (
        password.length < 6
      ) {

        message.style.display = "block";

        message.style.color =
          "#e31e24";

        message.textContent =
          "Password must contain at least 6 characters.";

        return;

      }


      /*
        DEMO ONLY

        The real account creation system
        will be connected later.
      */

      message.style.display = "block";

      message.style.color =
        "#16803c";

      message.textContent =
        "Account details accepted. Your VINN account will be created when the backend is connected.";

    }

  </script>


</body>

  </html>
